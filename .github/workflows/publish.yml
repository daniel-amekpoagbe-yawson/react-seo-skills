name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url here on purpose: setup-node would write an
      # _authToken line to .npmrc, which prevents npm from using OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm 11.5.1+ (required for trusted publishing)
        run: npm install -g npm@latest

      - name: Run tests
        run: npm test

      - name: Publish with provenance
        run: npm publish
